name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run test suite
        shell: pwsh
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release binary (fat LTO)
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            cargo build --release --locked --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Build attempt $attempt failed, retrying in 10s..."
            Start-Sleep -Seconds 10
          } while ($attempt -lt 3)
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed after $attempt attempts" }

      - name: Validate single-file executable
        shell: pwsh
        run: |
          $exe = "target\x86_64-pc-windows-msvc\release\vmax-imprint.exe"
          if (-not (Test-Path $exe)) { throw "Release binary not found at $exe" }
          Get-ChildItem (Split-Path $exe) -Filter *.dll | ForEach-Object { throw "Unexpected DLL beside executable: $($_.Name)" }
          Write-Host "Standalone executable verified: $exe ($((Get-Item $exe).Length) bytes)"

      - name: Package release ZIP
        shell: pwsh
        run: |
          $exe = "target\x86_64-pc-windows-msvc\release\vmax-imprint.exe"
          Compress-Archive -Path $exe, "README.md", "CHANGELOG.md" -DestinationPath "vmax-imprint-windows.zip" -Force
          Write-Host "Release package created: vmax-imprint-windows.zip ($((Get-Item vmax-imprint-windows.zip).Length) bytes)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmax-imprint-windows
          path: |
            target/x86_64-pc-windows-msvc/release/vmax-imprint.exe
            vmax-imprint-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-pc-windows-msvc/release/vmax-imprint.exe
            vmax-imprint-windows.zip
          generate_release_notes: true
