name: Windows release

# This project is a standalone repo: the workflow runs at the repo root.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Run tests
        shell: pwsh
        run: cargo test --locked --target x86_64-pc-windows-msvc
      # Retry the build: ort's static lib comes from pyke's CDN, which
      # occasionally serves a bad file (checksum mismatch) — v1.0.2's
      # first Windows build failed exactly that way. Cargo resumes cleanly.
      - name: Build release exe
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            cargo build --release --locked --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "build attempt $attempt failed, retrying in 10s..."
            Start-Sleep -Seconds 10
          } while ($attempt -lt 3)
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed after $attempt attempts" }
      - name: Check single-exe (no app DLLs beside it)
        shell: pwsh
        run: |
          $exe = "target\x86_64-pc-windows-msvc\release\vmax-imprint.exe"
          if (-not (Test-Path $exe)) { throw "exe missing" }
          Get-ChildItem (Split-Path $exe) -Filter *.dll | ForEach-Object { throw "unexpected DLL: $($_.Name)" }
          Write-Host "exe size: $((Get-Item $exe).Length) bytes"
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: vmax-imprint-windows
          path: target/x86_64-pc-windows-msvc/release/vmax-imprint.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-msvc/release/vmax-imprint.exe
